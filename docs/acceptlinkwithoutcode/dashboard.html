<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Manager - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 20px; }
        .table { color: #e0e0e0; vertical-align: middle; }
        .table-hover tbody tr:hover { background-color: #2c2c2c; color: #fff; }
        .status-badge { font-size: 0.8rem; padding: 0.4em 0.7em; }
        .form-control, .form-control:focus { background-color: #2b2b2b; border-color: #444; color: #fff; }
        .header-section { background: linear-gradient(90deg, #1e3a8a, #1e1e1e); padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="header-section d-flex justify-content-between align-items-center shadow">
        <div>
            <h3 class="mb-0 text-info"><i class="fas fa-robot me-2"></i><span id="uid">Link Automation Manager</span></h3>
            <small class="text-secondary">Chào anh, chúc anh một ngày làm việc hiệu quả!</small>
        </div>
        <div class="btn-group shadow">
            
            <button id="btnStart" class="btn btn-success px-4">
                <i class="fas fa-play me-2"></i>BẮT ĐẦU
            </button>
            
            <div class="form-check px-4 ms-2">
                <label class="form-check-label">
                    chay no veri
                    <input class="form-check-input" type="checkbox" id="runNoVeri" checked>
                </label>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header border-secondary text-info fw-bold">
                    <i class="fas fa-edit me-2"></i>NHẬP HOTMAIL 
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <div class="input-group mb-2">
                            <span class="input-group-text">sheet:</span>
                            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1" id="input-sheet" value="https://docs.google.com/spreadsheets/d/1_By88ioK87UfjgrSF17bSU6xHkSoAnietTvSBJ3CaCI/edit?gid=0#gid=0">
                            <button class="btn btn-primary" type="button" id="button-get-sheet-data">LOAD SHEET</button>
                        </div>
                        <div class="input-group mb-2">
                            <span class="input-group-text">password:</span>
                            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1" id="input-password">
                        </div>
                        <label class="form-label text-secondary small">Danh sách Hotmail (mỗi email 1 dòng):</label>
                        <textarea id="EmailInput" class="form-control" wrap="off" rows="10" placeholder=""></textarea>
                    </div>
                </div>
            </div>
            <div class="card shadow">
                <div class="card-header border-secondary text-info fw-bold">
                    <i class="fas fa-edit me-2"></i>Link Lỗi
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <textarea id="linkError" wrap="off" class="form-control" rows="10" placeholder=""></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                    <span class="text-info fw-bold"><i class="fas fa-list me-2"></i>DANH SÁCH LINK</span>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#import">
                        <i class="bi bi-box-arrow-in-down"></i>Nhập link
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 500px;">
                        <table class="table table-hover mb-0" style="table-layout: fixed; width: 100%;">
                            <thead class="table-dark">
                                <tr>
                                    <th class="text-center" style="width: 40px;">
                                        <input type="checkbox" class="form-check-input" id="selectAll" checked>
                                    </th>
                                    <th class="text-center" style="width: 50px;">STT</th>
                                    <th style="width: 200px;">Link</th>
                                    <th class="text-center">Message</th>
                                </tr>
                            </thead>
                            <tbody id="linkTableBody">
                                
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="import" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" >import</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-floating">
            <textarea class="form-control text-nowrap" id="textarea-import" style="height: 300px;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary action-button" data-bs-dismiss="modal" id="new-import">Nhập</button>
      </div>
    </div>
  </div>
</div>

<script src="libs/bt.js"></script>
<script src="dashboard_re.js"></script>
</body>
</html>
